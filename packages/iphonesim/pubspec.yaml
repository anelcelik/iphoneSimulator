name: iphonesim
description: >-
  Run Flutter apps on Linux inside an iPhone simulator window: device frame,
  screen size, safe areas, status bar, keyboard, touch input and screenshots.
version: 0.1.0
publish_to: none
repository: https://github.com/anelcelik/iphoneSimulator

environment:
  sdk: ^3.6.0

executables:
  iphonesim: iphonesim

dependencies:
  args: ^2.6.0
  path: ^1.9.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
